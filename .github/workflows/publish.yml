name: Test and Publish

on:
  push:

env:
  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

permissions:
  contents: write

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - cdk: "2.190.0"
            constructs: "10.0.0"
          - cdk: "2.278.0"
            constructs: "10.8.1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Select minimum supported CDK
        if: matrix.cdk == '2.190.0'
        run: >-
          yarn add --dev --exact
          aws-cdk-lib@${{ matrix.cdk }}
          @aws-cdk/integ-tests-alpha@${{ matrix.cdk }}-alpha.0
          constructs@${{ matrix.constructs }}
      - run: yarn build
      - run: yarn test --runInBand
      - name: Build and synthesize example with current CDK
        if: matrix.cdk == '2.278.0'
        run: |
          yarn --cwd example install --frozen-lockfile
          yarn --cwd example build
          CDK_OUTDIR="$RUNNER_TEMP/example.cdk.out" node example/bin/example.js

  integ-tests:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: us-east-1

      - name: Bootstrap CDK toolkit
        run: npx cdk bootstrap aws://${{ secrets.AWS_ACCOUNT_ID }}/us-east-1

      - name: Run integration tests
        run: yarn integ --force
        env:
          CDK_INTEG_ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID }}
          CDK_INTEG_REGION: us-east-1

  publish:
    needs: integ-tests
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build

      - name: Setup git
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Publish to npm
        run: npx release-it -VV
